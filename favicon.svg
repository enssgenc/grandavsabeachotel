<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Grand Avşa Hotel">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa9b5"/>
      <stop offset="0.55" stop-color="#1d6e78"/>
      <stop offset="1" stop-color="#0d2433"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c674"/>
      <stop offset="1" stop-color="#c2913f"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sea)"/>
    <!-- Gün batımı güneşi -->
    <circle cx="256" cy="212" r="92" fill="url(#sun)"/>
    <!-- Güneş yansıması/parıltı -->
    <circle cx="256" cy="212" r="92" fill="#ffffff" opacity="0.08"/>
    <!-- Dalga 1 (kum) -->
    <path d="M-20 360 C 70 320, 150 400, 256 360 S 440 320, 532 360 L 532 420 L -20 420 Z" fill="#e9dfcf"/>
    <!-- Dalga 2 (beyaz köpük) -->
    <path d="M-20 410 C 80 372, 160 446, 256 408 S 450 372, 532 410 L 532 532 L -20 532 Z" fill="#f7f1e6"/>
  </g>
</svg>

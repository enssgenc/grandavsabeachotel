<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Avşa Adası gezilecek yerler ve plajlar kapağı">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16384d"/>
      <stop offset="1" stop-color="#2f9aa6"/>
    </linearGradient>
    <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9aa6"/>
      <stop offset="1" stop-color="#1d6e78"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#gBg)"/>
  <circle cx="1440" cy="150" r="230" fill="none" stroke="#e9dfcf" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="1440" cy="150" r="150" fill="none" stroke="#e9dfcf" stroke-opacity="0.10" stroke-width="2"/>
  <!-- güneş -->
  <g transform="translate(1250,240)">
    <circle r="72" fill="#c2913f"/>
    <g stroke="#c2913f" stroke-width="7" stroke-linecap="round" stroke-opacity="0.85">
      <line x1="0" y1="-100" x2="0" y2="-125"/>
      <line x1="0" y1="100" x2="0" y2="125"/>
      <line x1="-100" y1="0" x2="-125" y2="0"/>
      <line x1="100" y1="0" x2="125" y2="0"/>
      <line x1="-72" y1="-72" x2="-90" y2="-90"/>
      <line x1="72" y1="72" x2="90" y2="90"/>
      <line x1="72" y1="-72" x2="90" y2="-90"/>
      <line x1="-72" y1="72" x2="-90" y2="90"/>
    </g>
  </g>
  <!-- kum -->
  <path d="M0 760 Q 400 720 800 760 T 1600 760 L1600 1000 L0 1000 Z" fill="#e9dfcf"/>
  <!-- deniz -->
  <path d="M0 700 Q 420 665 800 700 T 1600 700 L1600 800 Q 1180 835 800 800 T 0 800 Z" fill="url(#gSea)"/>
  <!-- şemsiye -->
  <g transform="translate(1120,560)">
    <line x1="0" y1="0" x2="0" y2="210" stroke="#1d6e78" stroke-width="9" stroke-linecap="round"/>
    <path d="M-140 0 A 140 140 0 0 1 140 0 Z" fill="#ffffff"/>
    <path d="M-140 0 A 140 140 0 0 1 -70 -121 L0 0 Z" fill="#c2913f"/>
    <path d="M0 -140 A 140 140 0 0 1 70 -121 L0 0 Z" fill="#2f9aa6"/>
    <path d="M70 -121 A 140 140 0 0 1 140 0 L0 0 Z" fill="#c2913f"/>
  </g>
  <!-- deniz topu -->
  <circle cx="1330" cy="740" r="34" fill="#ffffff"/>
  <path d="M1296 740 a34 34 0 0 1 68 0z" fill="#2f9aa6"/>
  <path d="M1330 706 a34 34 0 0 1 0 68z" fill="#c2913f" fill-opacity="0.85"/>
  <!-- metin -->
  <g>
    <rect x="120" y="470" width="60" height="3" fill="#c2913f"/>
    <text x="196" y="482" font-family="Manrope, Arial, sans-serif" font-size="30" letter-spacing="9" fill="#e9dfcf" font-weight="700">GEZİ REHBERİ</text>
    <g font-family="Georgia, 'Times New Roman', serif">
      <text x="118" y="580" font-size="98" fill="#ffffff" font-weight="500">Gezilecek Yerler</text>
      <text x="118" y="694" font-size="98" fill="#e9dfcf" font-style="italic" font-weight="500">&amp; Plajlar</text>
    </g>
    <text x="122" y="900" font-family="Manrope, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#0d2433" fill-opacity="0.72" font-weight="700">GRAND AVŞA HOTEL</text>
  </g>
</svg>
